<!DOCTYPE html>
<html lang="en" data-theme="emerald">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatCraft</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="h-screen w-screen overflow-hidden select-none transition-colors duration-300">

    <!-- ========================================== -->
    <!-- AUTHENTICATION SCREEN -->
    <!-- ========================================== -->
    <div id="auth-screen" class="h-full w-full flex items-center justify-center bg-dot-pattern transition-opacity">
      <div class="theme-card border rounded-2xl w-full max-w-sm p-8 shadow-2xl">
        <div class="flex items-center gap-3 mb-6">
          <div class="w-10 h-10 rounded-xl bg-indigo-500 flex items-center justify-center text-white shadow-inner">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.046 2 11c0 2.213.916 4.246 2.42 5.815a9.982 9.982 0 00-.814 3.737.5.5 0 00.785.42c1.782-1.22 3.652-1.572 5.097-1.615A10.874 10.874 0 0012 20c5.523 0 10-4.046 10-9s-4.477-9-10-9zm-3 10a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/></svg>
          </div>
          <div>
            <h1 class="text-xl font-bold">ChatCraft</h1>
            <p id="auth-subtitle" class="text-sm text-gray-400">Create your account</p>
          </div>
        </div>

        <form id="auth-form" class="space-y-4">
          <div id="username-group">
            <label class="block text-xs text-gray-400 mb-1">Username</label>
            <input type="text" id="auth-username" class="w-full px-4 py-2.5 rounded-xl border theme-card focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" />
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Email</label>
            <input type="email" id="auth-email" required class="w-full px-4 py-2.5 rounded-xl border theme-card focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" />
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Password</label>
            <input type="password" id="auth-password" required class="w-full px-4 py-2.5 rounded-xl border theme-card focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" />
          </div>

          <p id="auth-error" class="text-red-500 text-xs hidden"></p>

          <button type="submit" id="auth-submit-btn" class="w-full py-3 mt-2 rounded-xl text-sm font-bold bg-indigo-500 text-white hover:bg-indigo-600 transition shadow-md">
            Create account
          </button>
        </form>

        <div class="mt-6 text-center">
          <button id="auth-toggle-btn" class="text-xs text-gray-400 hover:text-white transition">
            Already have an account? Sign in
          </button>
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- MAIN CHAT INTERFACE (Hidden by default) -->
    <!-- ========================================== -->
    <div id="chat-screen" class="hidden h-full flex flex-col">
      <!-- HEADER -->
      <header class="theme-header px-4 py-3 flex items-center justify-between z-10 shadow-sm">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white font-extrabold text-xl shadow-inner theme-btn-primary">C</div>
          <div>
            <h1 class="text-base font-bold leading-tight">ChatCraft</h1>
            <p class="text-[11px] text-gray-400 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>Online</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <!-- Calls -->
          <button id="start-audio-btn" class="p-2 rounded-lg border theme-card transition hover:text-emerald-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
          </button>
          <button id="start-video-btn" class="p-2 rounded-lg border theme-card transition hover:text-emerald-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          </button>
          
          <div class="h-6 w-[1px] bg-gray-500/30 mx-1"></div>
          
          <!-- Profile Button (CRITICAL ID ADDED HERE) -->
          <button id="edit-profile-btn" class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold rounded-lg border theme-card transition hover:opacity-80">
            <img id="header-avatar" src="https://via.placeholder.com/32" class="w-5 h-5 rounded-full object-cover" />
            <span class="hidden sm:inline">Profile & Themes</span>
          </button>
        </div>
      </header>

      <!-- CHAT WINDOW -->
      <div id="chat-window" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 scroll-smooth"></div>

      <!-- FOOTER / INPUT -->
      <footer class="theme-header p-3 sm:p-4 border-t relative">
        <div id="emoji-picker-wrapper" class="absolute bottom-16 left-4 z-40 hidden shadow-2xl rounded-2xl overflow-hidden border border-gray-700"></div>
        <form id="chat-form" class="flex items-center gap-2 max-w-5xl mx-auto">
          <button type="button" id="emoji-btn" class="p-2.5 hover:text-emerald-500 transition rounded-xl theme-card border">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </button>
          <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off" class="flex-1 px-4 py-2.5 rounded-xl border theme-card focus:outline-none text-sm" />
          <button type="submit" id="send-btn" class="px-5 py-2.5 rounded-xl text-sm font-bold theme-btn-primary shadow-md">Send</button>
        </form>
      </footer>
    </div>

    <!-- CALL MODAL CONTAINER (For calls.js) -->
    <div id="call-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
      <div class="theme-card border rounded-2xl w-full max-w-2xl p-6 shadow-2xl relative flex flex-col items-center">
        <h3 id="call-status" class="text-lg font-bold mb-4">In Call</h3>
        <div class="relative w-full aspect-video bg-black/80 rounded-xl overflow-hidden flex items-center justify-center mb-6">
          <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
          <video id="local-video" autoplay playsinline muted class="absolute bottom-3 right-3 w-32 h-24 rounded-lg object-cover border-2 shadow-lg"></video>
        </div>
        <div class="flex items-center gap-4">
          <button id="toggle-mic-btn" class="p-3 rounded-full bg-gray-700 text-white transition">Mic</button>
          <button id="end-call-btn" class="p-3 rounded-full bg-red-600 text-white transition">End</button>
        </div>
      </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
