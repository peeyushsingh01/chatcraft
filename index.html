<!DOCTYPE html>
<html lang="en" data-theme="emerald">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatCraft — Realtime Chat & Calls</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="h-screen w-screen flex flex-col overflow-hidden select-none">
    
    <header class="theme-header px-4 py-3 flex items-center justify-between z-10 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-extrabold text-xl shadow-inner">C</div>
        <div>
          <h1 class="text-base font-bold leading-tight">ChatCraft</h1>
          <p class="text-[11px] text-gray-400 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>Online</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="start-audio-btn" title="Start Voice Call" class="p-2 rounded-lg border theme-card hover:border-emerald-500 transition text-gray-300 hover:text-emerald-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
        </button>
        <button id="start-video-btn" title="Start Video Call" class="p-2 rounded-lg border theme-card hover:border-emerald-500 transition text-gray-300 hover:text-emerald-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        </button>
        <div class="h-5 w-[1px] bg-gray-700/50 mx-1"></div>
        <button id="edit-profile-btn" class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold rounded-lg border theme-card hover:border-emerald-500 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
          <span>Profile & Themes</span>
        </button>
      </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
      <div class="flex-1 flex flex-col justify-between h-full bg-opacity-30">
        <div id="chat-window" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 scroll-smooth"></div>
        <footer class="theme-header p-3 sm:p-4 border-t relative">
          <div id="emoji-picker-wrapper" class="absolute bottom-16 left-4 z-40 hidden shadow-2xl rounded-2xl overflow-hidden border border-gray-700"></div>
          <form id="chat-form" class="flex items-center gap-2 max-w-5xl mx-auto">
            <button type="button" id="emoji-btn" title="Add Emoji" class="p-2.5 text-gray-400 hover:text-emerald-500 transition rounded-xl theme-card border">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </button>
            <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off" class="flex-1 px-4 py-2.5 rounded-xl border theme-card focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" />
            <button type="submit" id="send-btn" class="px-5 py-2.5 rounded-xl text-sm font-bold theme-btn-primary shadow-md">Send</button>
          </form>
        </footer>
      </div>
    </div>

    <div id="call-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
      <div class="theme-card border rounded-2xl w-full max-w-2xl p-6 shadow-2xl relative flex flex-col items-center">
        <h3 id="call-status" class="text-lg font-bold mb-4">In Call</h3>
        <div class="relative w-full aspect-video bg-black/80 rounded-xl overflow-hidden flex items-center justify-center mb-6">
          <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
          <video id="local-video" autoplay playsinline muted class="absolute bottom-3 right-3 w-32 h-24 rounded-lg object-cover border-2 border-emerald-500 shadow-lg"></video>
        </div>
        <div class="flex items-center gap-4">
          <button id="toggle-mic-btn" class="p-3 rounded-full bg-gray-700 text-white hover:bg-gray-600 transition" title="Toggle Microphone">Mic</button>
          <button id="end-call-btn" class="p-3 rounded-full bg-red-600 text-white hover:bg-red-700 transition" title="End Call">End</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
